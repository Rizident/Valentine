<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Victory!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="victory-body">
  <h1>Thank You!</h1>
  <button onclick="window.location.href='/'">Back</button>
  <canvas id="confetti"></canvas>
  <audio id="victorySound" src="victory.mp3" autoplay></audio>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const duration = 5000;
    const end = Date.now() + duration;

    (function frame() {
      confetti({
        particleCount: 6,
        angle: 60,
        spread: 55,
        origin: { x: 0 }
      });
      confetti({
        particleCount: 6,
        angle: 120,
        spread: 55,
        origin: { x: 1 }
      });

      if (Date.now() < end) {
        requestAnimationFrame(frame);
      }
    })();
  </script>
</body>
</html>
